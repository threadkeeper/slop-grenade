[package]
name = "slop-grenade"
version = "0.2.1"
edition = "2021"
description = "Real-time M365 AI Slop & Slop Grenade detector via WorkIQ MCP and GitHub GPT Luna with physics monitor overlay."
license-file = "../LICENSE"
publish = false

[lib]
name = "slop_grenade"
path = "src/lib.rs"

[[bin]]
name = "slop-grenade"
path = "src/main.rs"

[dependencies]
slop-grenade-core = { path = "../core" }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
html2text = "0.15"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
