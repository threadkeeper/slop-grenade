[package]
name = "slop-grenade"
version = "0.1.0"
edition = "2021"
description = "Real-time M365 AI Slop & Slop Grenade detector via WorkIQ MCP and GitHub GPT Luna with physics monitor overlay."
license-file = "../LICENSE"
publish = false

[lib]
name = "slop_grenade"
path = "src/lib.rs"

[[bin]]
name = "slop-grenade"
path = "src/main.rs"

[dependencies]
axum = "0.8"
futures = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
