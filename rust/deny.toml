# cargo-deny configuration for Slop Grenade (aligned with gaia-robot).
# Enforces supply-chain rules across core/, rust/, and mobile/rust-bridge/:
# no known-vulnerable, unmaintained, yanked, or untrusted dependencies.
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail on any crate with a known security vulnerability or yanked release.
yanked = "deny"
ignore = []

[licenses]
# Only allow well-known, permissive open-source licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # CDLA-Permissive-2.0 covers the bundled Mozilla CA root certificate store
    # in `webpki-roots` (pulled in by `reqwest` / `rustls-tls`).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Workspace crates (`slop-grenade`, `slop-grenade-core`, `slop-mobile-bridge`)
# are marked `publish = false` and reference `../LICENSE`.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl", reason = "prefer rustls-tls for zero native OpenSSL surface" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
