[package]
name = "slop-mobile-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"

[lib]
name = "slop_mobile_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
jni = { version = "0.21.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slop-grenade-core = { path = "../../core" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
