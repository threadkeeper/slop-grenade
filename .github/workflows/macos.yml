name: macOS desktop compatibility

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "core/**"
      - "rust/**"
      - "web/**"
      - "macos/**"
      - "scripts/install-macos.sh"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "core/**"
      - "rust/**"
      - "web/**"
      - "macos/**"
      - "scripts/install-macos.sh"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build Universal macOS App & Daemon (arm64 + x86_64)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust targets for Universal macOS binary
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            core
            rust

      - name: Run Rust daemon tests on macOS
        run: |
          cargo test --locked --manifest-path core/Cargo.toml
          cargo test --locked --manifest-path rust/Cargo.toml

      - name: Build Svelte 5 web assets
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build Universal Rust daemon (arm64 + x86_64)
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path rust/Cargo.toml --release --target aarch64-apple-darwin
          cargo build --locked --manifest-path rust/Cargo.toml --release --target x86_64-apple-darwin
          mkdir -p rust/target/universal-apple-darwin/release
          lipo -create \
            rust/target/aarch64-apple-darwin/release/slop-grenade \
            rust/target/x86_64-apple-darwin/release/slop-grenade \
            -output rust/target/universal-apple-darwin/release/slop-grenade
          lipo -info rust/target/universal-apple-darwin/release/slop-grenade

      - name: Compile Universal macOS Menu Bar & Screen Overlay (Swift AppKit + WebKit)
        run: |
          set -euo pipefail
          mkdir -p macos/build
          swiftc -O -target arm64-apple-macos13.0 macos/SlopGrenadeOverlay.swift \
            -framework Cocoa -framework WebKit \
            -o macos/build/slop-grenade-overlay-arm64
          swiftc -O -target x86_64-apple-macos13.0 macos/SlopGrenadeOverlay.swift \
            -framework Cocoa -framework WebKit \
            -o macos/build/slop-grenade-overlay-x86_64
          lipo -create \
            macos/build/slop-grenade-overlay-arm64 \
            macos/build/slop-grenade-overlay-x86_64 \
            -output macos/build/slop-grenade-overlay
          lipo -info macos/build/slop-grenade-overlay

      - name: Package Universal macOS bundle and SHA-256 checksum
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/slop-grenade-macos-universal"
          APP="$STAGE/Slop Grenade.app"
          rm -rf "$STAGE"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/web" "$STAGE/web"
          cp macos/Info.plist "$APP/Contents/Info.plist"
          cp macos/build/slop-grenade-overlay "$APP/Contents/MacOS/slop-grenade-overlay"
          cp rust/target/universal-apple-darwin/release/slop-grenade "$APP/Contents/MacOS/slop-grenade"
          cp -R web/build "$APP/Contents/Resources/web/build"
          chmod +x "$APP/Contents/MacOS/slop-grenade-overlay" "$APP/Contents/MacOS/slop-grenade"
          codesign --force --deep --sign - "$APP"

          cp rust/target/universal-apple-darwin/release/slop-grenade "$STAGE/slop-grenade"
          cp -R web/build "$STAGE/web/build"
          cp scripts/install-macos.sh "$STAGE/install-macos.sh"
          chmod +x "$STAGE/slop-grenade" "$STAGE/install-macos.sh"
          cp README.md "$STAGE/README.md"
          cp LICENSE "$STAGE/LICENSE"

          TAR_NAME="slop-grenade-macos-universal.tar.gz"
          tar -C "$STAGE" -czf "$PWD/$TAR_NAME" .
          HASH="$(shasum -a 256 "$PWD/$TAR_NAME" | awk '{print $1}')"
          printf "%s  %s" "$HASH" "$TAR_NAME" > "$PWD/$TAR_NAME.sha256"
          shasum -a 256 -c "$PWD/$TAR_NAME.sha256"

      - name: Upload verified macOS Universal bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slop-grenade-macos-universal
          path: |
            slop-grenade-macos-universal.tar.gz
            slop-grenade-macos-universal.tar.gz.sha256
          if-no-files-found: error

      - name: Attach macOS Universal bundle to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" \
            slop-grenade-macos-universal.tar.gz \
            slop-grenade-macos-universal.tar.gz.sha256 \
            --clobber
