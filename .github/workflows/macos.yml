name: macOS desktop compatibility

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "rust/**"
      - "web/**"
      - "macos/**"
      - "scripts/install-macos.sh"
      - "scripts/test-macos-installer.sh"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "core/**"
      - "rust/**"
      - "web/**"
      - "macos/**"
      - "scripts/install-macos.sh"
      - "scripts/test-macos-installer.sh"
      - ".github/workflows/macos.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build Universal macOS App & Daemon (arm64 + x86_64)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust targets for Universal macOS binary
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: |
            core
            rust

      - name: Run Rust daemon tests on macOS
        run: |
          cargo test --locked --manifest-path core/Cargo.toml
          cargo test --locked --manifest-path rust/Cargo.toml

      - name: Build Svelte 5 web assets
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Build Universal Rust daemon (arm64 + x86_64)
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ vars.GMAIL_PRODUCTION_APPROVED == 'true' && vars.GMAIL_OAUTH_CLIENT_ID || '' }}
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path rust/Cargo.toml --release --target aarch64-apple-darwin
          cargo build --locked --manifest-path rust/Cargo.toml --release --target x86_64-apple-darwin
          mkdir -p rust/target/universal-apple-darwin/release
          lipo -create \
            rust/target/aarch64-apple-darwin/release/slop-grenade \
            rust/target/x86_64-apple-darwin/release/slop-grenade \
            -output rust/target/universal-apple-darwin/release/slop-grenade
          lipo -info rust/target/universal-apple-darwin/release/slop-grenade

      - name: Compile Universal macOS Menu Bar & Screen Overlay (Swift AppKit + WebKit)
        run: |
          set -euo pipefail
          mkdir -p macos/build
          swiftc -O -target arm64-apple-macos13.0 macos/SlopGrenadeOverlay.swift \
            -framework Cocoa -framework WebKit \
            -o macos/build/slop-grenade-overlay-arm64
          swiftc -O -target x86_64-apple-macos13.0 macos/SlopGrenadeOverlay.swift \
            -framework Cocoa -framework WebKit \
            -o macos/build/slop-grenade-overlay-x86_64
          lipo -create \
            macos/build/slop-grenade-overlay-arm64 \
            macos/build/slop-grenade-overlay-x86_64 \
            -output macos/build/slop-grenade-overlay
          lipo -info macos/build/slop-grenade-overlay

      - name: Package Universal macOS installer, portable bundle and SHA-256 checksums
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/slop-grenade-macos-universal"
          APP="$STAGE/Slop Grenade.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/web"
          cp macos/Info.plist "$APP/Contents/Info.plist"
          VERSION="$(cat VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP/Contents/Info.plist"
          cp macos/build/slop-grenade-overlay "$APP/Contents/MacOS/slop-grenade-overlay"
          cp rust/target/universal-apple-darwin/release/slop-grenade "$APP/Contents/MacOS/slop-grenade"
          cp -R web/build "$APP/Contents/Resources/web/build"
          chmod +x "$APP/Contents/MacOS/slop-grenade-overlay" "$APP/Contents/MacOS/slop-grenade"
          codesign --force --deep --sign - "$APP"

          pkgbuild --analyze --root "$STAGE" "$RUNNER_TEMP/components.plist"
          /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" "$RUNNER_TEMP/components.plist"
          pkgbuild --root "$STAGE" \
            --component-plist "$RUNNER_TEMP/components.plist" \
            --install-location /Applications \
            --identifier com.threadkeeper.slop-grenade \
            --version "$VERSION" \
            "$PWD/slop-grenade-macos-universal.pkg"

          cp rust/target/universal-apple-darwin/release/slop-grenade "$STAGE/slop-grenade"
          mkdir -p "$STAGE/web"
          cp -R web/build "$STAGE/web/build"
          cp scripts/install-macos.sh "$STAGE/install-macos.sh"
          chmod +x "$STAGE/slop-grenade" "$STAGE/install-macos.sh"
          cp README.md "$STAGE/README.md"
          cp LICENSE "$STAGE/LICENSE"

          TAR_NAME="slop-grenade-macos-universal.tar.gz"
          tar -C "$STAGE" -czf "$PWD/$TAR_NAME" .
          for NAME in "$TAR_NAME" slop-grenade-macos-universal.pkg; do
            HASH="$(shasum -a 256 "$PWD/$NAME" | awk '{print $1}')"
            printf "%s  %s\n" "$HASH" "$NAME" > "$PWD/$NAME.sha256"
            shasum -a 256 -c "$PWD/$NAME.sha256"
          done

      - name: Install and launch the macOS package
        run: bash scripts/test-macos-installer.sh "$PWD/slop-grenade-macos-universal.pkg"

      - name: Upload verified macOS Universal installer and portable bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slop-grenade-macos-universal
          path: |
            slop-grenade-macos-universal.pkg
            slop-grenade-macos-universal.pkg.sha256
            slop-grenade-macos-universal.tar.gz
            slop-grenade-macos-universal.tar.gz.sha256
          if-no-files-found: error
