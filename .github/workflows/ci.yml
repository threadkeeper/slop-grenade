name: CI

# Fast code quality and security gates on every push and pull request (aligned with gaia-robot).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: Rust Format, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            core
            rust
            mobile/rust-bridge

      - name: Check formatting, Clippy, and tests across all Rust crates
        run: |
          set -euo pipefail
          for manifest in core/Cargo.toml rust/Cargo.toml mobile/rust-bridge/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --all -- --check
            cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
            cargo test --locked --manifest-path "$manifest"
          done

  application-quality:
    name: Frontend & Infrastructure Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check frontend types, unit tests, and build
        run: |
          npm ci --prefix web
          npm run check --prefix web
          npm test --prefix web
          npm run build --prefix web

      - name: Run infrastructure & supply-chain policy checks
        run: python3 -m unittest discover -s infra -p 'test_*.py'
