name: Windows desktop compatibility

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "rust/**"
      - "web/**"
      - "desktop/**"
      - "tests/desktop/**"
      - "scripts/test-desktop.ps1"
      - "scripts/test-windows-installer.ps1"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "core/**"
      - "rust/**"
      - "web/**"
      - "desktop/**"
      - "tests/desktop/**"
      - "scripts/test-desktop.ps1"
      - "scripts/test-windows-installer.ps1"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Optional version tag for the complete platform release
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  hover:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: C# 5 hover regression and window tests
        shell: pwsh
        run: .\scripts\test-desktop.ps1
      - name: Compile the production overlay
        shell: pwsh
        run: |
          & 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe' /nologo /langversion:5 /target:winexe /optimize+ /r:System.dll,System.Drawing.dll,System.Windows.Forms.dll,System.Web.Extensions.dll /out:desktop\slop-grenade-overlay.exe '/recurse:desktop\*.cs'
          if ($LASTEXITCODE -ne 0) { throw 'Desktop compilation failed.' }
      - name: Build web assets and release Rust daemon
        shell: pwsh
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ vars.GMAIL_PRODUCTION_APPROVED == 'true' && vars.GMAIL_OAUTH_CLIENT_ID || '' }}
        run: |
          npm --prefix web ci
          npm --prefix web run build
          cargo build --locked --manifest-path rust/Cargo.toml --release
      - name: Package Windows installer, portable bundle and SHA-256 checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'slop-grenade-windows-x64'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'bin'), (Join-Path $stage 'web') | Out-Null
          Copy-Item -Force 'rust\target\release\slop-grenade.exe' (Join-Path $stage 'bin\slop-grenade.exe')
          Copy-Item -Force 'desktop\slop-grenade-overlay.exe' (Join-Path $stage 'bin\slop-grenade-overlay.exe')
          Copy-Item -Recurse -Force 'web\build' (Join-Path $stage 'web\build')
          Copy-Item -Force 'README.md' (Join-Path $stage 'README.md')
          Copy-Item -Force 'LICENSE' (Join-Path $stage 'LICENSE')
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { (Get-Content VERSION -Raw).Trim() }
          if ($env:RELEASE_TAG) {
            python scripts/release.py validate-tag "$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Invalid release tag.' }
            $version = $env:RELEASE_TAG.Substring(1)
          }
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup 6 is required to build the Windows installer.' }
          & $compiler "/DSourceDir=$stage" "/DAppVersion=$version" "/DOutputDir=$PWD" desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer compilation failed.' }
          Compress-Archive -Path "$stage\*" -DestinationPath 'slop-grenade-windows-x64.zip' -Force
          foreach ($name in @('slop-grenade-windows-x64-setup.exe', 'slop-grenade-windows-x64.zip')) {
            $hash = (Get-FileHash -Path $name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -Encoding ascii -NoNewline "$name.sha256"
          }
      - name: Install, launch and uninstall the Windows package
        shell: pwsh
        run: .\scripts\test-windows-installer.ps1 -Installer "$PWD\slop-grenade-windows-x64-setup.exe"
      - name: Upload verified Windows installer and portable bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slop-grenade-windows-x64
          path: |
            slop-grenade-windows-x64-setup.exe
            slop-grenade-windows-x64-setup.exe.sha256
            slop-grenade-windows-x64.zip
            slop-grenade-windows-x64.zip.sha256
          if-no-files-found: error
